# ============================================================
# CENÁRIO SC-VR em L2 (Fase 7): cidade inteligente do artigo + o drone dos bombeiros em VR
# ============================================================
# Cópia do test_config_llm.yaml (a cidade inteligente só de vídeo, como no artigo) com:
#   - a fatia drone (tipo: vr) na upf4, com o UE ue-vr-07 e prioridade inicial 10;
#   - o bloco vr: piso condicional, agente da VR por SLA e o prompt do artigo (vr.llm: artigo = L2: o LLM não sabe
#     que a VR existe e não pode mudar a prioridade dela);
#   - os eventos da VR: o drone entra com o incêndio (180 s) e sai quando ele é controlado (600 s), como no plano.
# As intenções são as do artigo, nos mesmos tempos. O piso da VR vem do vr/calibracao.yaml.
# L3: o test_config_scvr_l3.yaml é este arquivo com vr.llm: vr e a saída em .../scvr_l3/.

# Metadados do teste
test_metadata:
  name: "scvr_l2"
  description: "Cenário SC-VR: cidade inteligente com o drone dos bombeiros em VR; prompt do artigo (L2)"
  timestamp: "2026-10-30"
  duration_seconds: 900  # 15 minutos total

# Parâmetros iniciais dos slices (Sincronizado com slice_agents.py)
initial_parameters:
  cpu: 0.2
  memory: 512.0
  bandwidth: 10.0
slices:
  policia:
    initial_priority: 5.0
    upf: "upf1"
    slice_id: "000001"
    dnn: "slice01"
    client_pod: "ue-video-01"
  bombeiros:
    initial_priority: 5.0
    upf: "upf2"
    slice_id: "000002"
    dnn: "slice02"
    client_pod: "ue-video-03"
  ambulancia:
    initial_priority: 5.0
    upf: "upf3"
    slice_id: "000003"
    dnn: "slice03"
    client_pod: "ue-video-05"
  drone:
    tipo: "vr"                 # VR: piso condicional, não é reiniciada pelo run_experiment, eventos vr_join/vr_leave
    initial_priority: 10.0
    upf: "upf4"
    slice_id: "000004"
    dnn: "slice04"
    client_pod: "ue-vr-07"
    # Como o prompt da L3 descreve esta fatia (em inglês, como o resto do prompt); a L2 não usa
    descricao: "firefighters' drone, teleoperated through a virtual reality (VR) stream. Inelastic: below a minimum of resources the stream freezes and the teleoperation stops."
    # floor_cpu e floor_bw: sem eles, valem os do vr/calibracao.yaml

# Chaves da VR (Fases 5 a 7)
vr:
  floor: on                    # piso condicional com rodada extra; off = sem piso (L0)
  agent: sla                   # agente da VR por SLA (Fase 6); utilizacao = o agente do vídeo
  llm: artigo                  # artigo = prompt do artigo, sem a VR (L2); vr = o prompt conhece a VR e o piso (L3)
  sla_agent:                   # o agente por SLA (spade_agents/agente_vr.py); estes são os padrões
    d_pedir: 0.5               # só pede recurso depois de gastar metade da folga do SLA
    throttling_min: 0.02       # fração dos períodos de 100 ms com a cota da upf4 esgotada para pedir CPU
    cpu_passo: 0.05            # núcleo a mais por rodada
    cpu_teto: 0.45             # acima disso, mais CPU não melhorou nada na calibração com vídeo (Fase 4)
    bw_passo: 1.0              # Mbps a mais por rodada, quando falta banda

# Parâmetros do leilão (Sincronizado com resource_agent.py)
auction:
  period_seconds: 30          # Período original do AuctioneerBehavior
  minimum_cpu: 0.01           # MINIMUM_CPU do resource_agent.py
  minimum_bw: 1.0             # MINIMUM_BW do resource_agent.py
  minimum_memory: 64          # MINIMUM_MEMORY do resource_agent.py
  total_cpu_pool: 0.8        # CORE_CPU_LIMIT real do servidor
  total_bw_pool: 35          # CORE_BW_LIMIT real do servidor
  total_memory_pool: 2048      # CORE_MEMORY_LIMIT real do servidor
  monitoring_period_seconds: 20  # Período de monitoramento para coleta de métricas

# Parâmetros de bidding dos slice agents (Sincronizado com slice_agents.py)
bidding:
  base_budget: 20.0
  base_income: 2.0
  base_bid: 10.0
  # Fase 7: com true, a prioridade nova do LLM também muda quanto o agente de vídeo pede (o priority do
  # calculate_coeff). false = como no artigo: o inform muda só o lance-base, a renda e a carteira
  inform_updates_priority: false
  high_stress_threshold: 0.6
  moderate_stress_threshold: 0.4
  comfortable_threshold: 0.2
  # Coeficientes de incremento de recursos em HIGH STRESS
  high_stress_coeff_max: 1.0
  high_stress_coeff_min: 0.2
  # Coeficientes de incremento de recursos em MODERATE STRESS
  moderate_stress_coeff_max: 0.5
  moderate_stress_coeff_min: 0.1
  # Coeficientes de incremento de recursos em COMFORTABLE
  comfortable_coeff_max: 0.15
  comfortable_coeff_min: 0.0

# Eventos do cenário SC-VR (plano, seção "Cenários"): as intenções do artigo, nos mesmos tempos; o drone entra com o
# incêndio e sai quando ele é controlado. No mesmo instante, os eventos rodam na ordem daqui: a intenção primeiro.
events:
  - timestamp: 0
    type: "vr_leave"
    description: "O drone começa fora da rede."
    vr_slice: "drone"

  - timestamp: 180
    type: "priority_change"
    description: "Incêndio detectado. Drones dos bombeiros ativados. Aumente a prioridade para garantir boa qualidade e baixa latência."
    changes:
      policia: 5.0
      bombeiros: 9.0
      ambulancia: 5.0

  - timestamp: 180
    type: "vr_join"
    description: "O drone dos bombeiros entra em teleoperação."
    vr_slice: "drone"

  - timestamp: 420
    type: "priority_change"
    description: "Perseguição policial iniciada a suspeitos de roubo, aumentar a prioridade para possibilitar comunicação de vídeo em tempo real."
    changes:
      policia: 9.0
      bombeiros: 9.0
      ambulancia: 5.0

  - timestamp: 600
    type: "priority_change"
    description: "Vítimas resgatadas e incêndio extinto. Necessidade de telemetria médica em tempo real. Ambulância recebe prioridade máxima e bombeiros retornam à prioridade padrão."
    changes:
      policia: 9.0
      bombeiros: 5.0
      ambulancia: 10.0

  - timestamp: 600
    type: "vr_leave"
    description: "Incêndio controlado: o drone sai e o piso é liberado."
    vr_slice: "drone"

  - timestamp: 700
    type: "priority_change"
    description: "Suspeitos detidos. Prioridades da polícia deve retornar ao normal."
    changes:
      policia: 5.0
      bombeiros: 5.0
      ambulancia: 10.0

# Clientes DASH a serem deployados (um por slice)
dash_clients:
  policia:
    count: 1
    start_id: 1
    session_duration: 900
  bombeiros:
    count: 1
    start_id: 2
    session_duration: 900
  ambulancia:
    count: 1
    start_id: 3
    session_duration: 900

# Monitoring e coleta
monitoring:
  prometheus_url: "http://localhost:35235/"
  prometheus_interval_seconds: 5
  kubectl_logs_interval_seconds: 5
  csv_output_dir: "../metricas_scripts/resultados/scvr_l2/teste/"
  auction_log_file: "auction_history.csv"
  event_log_file: "test_events.csv"
  timeseries_log_file: "qoe_timeseries.csv"

# Google Sheets (para saída final)
google_sheets:
  enabled: true
  spreadsheet_name: "Relatorio_Testes_5G_Dinamico"
  credentials_file: "credentials.json"
