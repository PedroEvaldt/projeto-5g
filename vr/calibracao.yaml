sla:                              # por janela de 12 s; falhar em qualquer critério = fora do SLA
  net_ref_ms: 1.87                # net_p95 sem aperto (pontos de folga: CPU 0,4 e banda 15)
  folga_net_ms: 3                 # net_p95 ≤ 4.87 ms
  perda_max_pct: 1
  cont_min_pct: 98
  vazao_min_mbps: 7.65            # 95% do fluxo de 8.05 Mbps
piso:                             # menor ponto com ≥ 95% das janelas no SLA (e todos acima dele), + 10%
  cpu: 0.22                       # passou em 0.2 núcleo; arredondado para cima em 10m
  banda_mbps: 9.9                 # passou em 9 Mbps; arredondado para cima em 0,1
pool:                             # piso + 3 × mínimo do vídeo ≤ total (tests_configs/test_config.yaml, auction)
  cpu: {piso_mais_videos: 0.25, total: 0.8, cabe: true}
  banda_mbps: {piso_mais_videos: 12.9, total: 35, cabe: true}
